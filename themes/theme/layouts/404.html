{{ define "main" }}
    <main id="spotlight" class="error-404">
        <p class="img-404">[404]</p>
        <div class="banner-404">
            <p class="home__label">Error</p>
            <h1>Page Not Found</h1>
            <p>{{ i18n "notFound" }}</p>
            <p class="btn-404">
                <a href="{{.Site.BaseURL}}">[{{ i18n "home" }}]</a>
                <a href="{{ "posts" | absLangURL }}">[{{ i18n "archives" }}]</a>
            </p>
        </div>
    </main>
{{ end }}
